<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>娱乐下棋 · 围棋 象棋 五子棋</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Press+Start+2P&display=swap" />
<style>
/* ===== 像素古风主题（大明风云同款视觉） ===== */
:root{
  --bg-0:#1a1208; --bg-1:#2a1f10; --bg-2:#3d2e1a; --bg-3:#5a4428;
  --gold-0:#d4a843; --gold-1:#f0c75e; --gold-dim:#8a6f3a;
  --text:#e8dcc0; --text-dim:#a08a60;
  --red:#c0532f; --green:#7ba05b; --blue:#5b7fa0;
  --pixel:'Press Start 2P','ZCOOL KuaiLe',monospace;
  --body:'ZCOOL KuaiLe','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;}
body{
  font-family:var(--body);color:var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, #2a1f10 0%, var(--bg-0) 70%);
  background-attachment:fixed;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
.hidden{display:none !important;}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:var(--text);}
input{font-family:var(--body);}
canvas{display:block;}

/* ===== 像素面板 ===== */
.panel{
  background:linear-gradient(180deg, #2f2312 0%, #241a0d 100%);
  border:2px solid var(--bg-3);
  box-shadow:0 0 0 2px #120d06, inset 0 0 0 1px #120d06, 0 6px 24px rgba(0,0,0,.55);
  border-radius:6px;
}
.panel-title{
  font-family:var(--pixel);font-size:12px;color:var(--gold-1);
  text-align:center;letter-spacing:2px;padding:12px 8px 10px;
  border-bottom:1px solid var(--bg-3);
  text-shadow:0 0 8px rgba(212,168,67,.35);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,#3d2e1a 0%,#2f2312 100%);
  border:2px solid var(--bg-3);color:var(--gold-0);
  font-size:15px;letter-spacing:1px;padding:10px 18px;border-radius:4px;
  transition:all .12s ease;
}
.btn:hover{background:linear-gradient(180deg,#4a3820 0%,#3d2e1a 100%);color:var(--gold-1);border-color:var(--gold-dim);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-gold{background:linear-gradient(180deg,#c9a24a 0%,#a07f33 100%);color:#241a0d;border-color:#8a6f3a;font-weight:bold;}
.btn-gold:hover{background:linear-gradient(180deg,#e0b558 0%,#c9a24a 100%);color:#241a0d;border-color:#a07f33;}
.btn-red{background:linear-gradient(180deg,#7a3a24 0%,#5a2a18 100%);color:#f0c7a0;border-color:#8a4a2e;}
.btn-red:hover{background:linear-gradient(180deg,#8a4428 0%,#7a3a24 100%);}
.btn-blue{background:linear-gradient(180deg,#2f4a63 0%,#24384c 100%);color:#a8c8e0;border-color:#3a5a78;}
.btn-blue:hover{background:linear-gradient(180deg,#3a5a78 0%,#2f4a63 100%);}
.btn-sm{font-size:13px;padding:6px 12px;}
.btn-xs{font-size:12px;padding:4px 10px;}
.input{
  width:100%;background:#1c1409;border:2px solid var(--bg-3);border-radius:4px;
  color:var(--text);font-size:16px;padding:10px 12px;outline:none;
  transition:border-color .12s;
}
.input:focus{border-color:var(--gold-dim);}
.input::placeholder{color:#6a5a3a;}

/* ===== 标题 ===== */
.logo-title{
  font-family:var(--pixel);font-size:26px;color:var(--gold-1);
  text-shadow:0 0 12px rgba(212,168,67,.5), 2px 2px 0 #000;
  letter-spacing:6px;text-align:center;
}
.logo-sub{
  font-size:14px;color:var(--text-dim);letter-spacing:4px;text-align:center;margin-top:8px;
}

/* ===== 登录页 ===== */
#login-view{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:10;
}
#login-view::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg, rgba(212,168,67,.02) 0 2px, transparent 2px 4px),
    radial-gradient(ellipse at 50% 40%, rgba(212,168,67,.06) 0%, transparent 60%);
  pointer-events:none;
}
.login-box{width:min(400px,92vw);padding:34px 30px 30px;position:relative;}
.login-box .logo-title{font-size:24px;letter-spacing:5px;}
.login-field{margin-top:14px;}
.login-field label{display:block;font-size:13px;color:var(--text-dim);letter-spacing:2px;margin-bottom:6px;}
.login-actions{display:flex;gap:10px;margin-top:20px;}
.login-actions .btn{flex:1;}
.login-hint{font-size:12px;color:var(--text-dim);text-align:center;margin-top:14px;line-height:1.7;}
.login-hint b{color:var(--gold-0);}
.server-line{font-size:12px;color:var(--text-dim);text-align:center;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;}
.server-line .dot{width:8px;height:8px;border-radius:50%;background:#6a5a3a;}
.server-line .dot.on{background:#7ba05b;box-shadow:0 0 6px rgba(123,160,91,.8);}
.server-line .dot.off{background:#c0532f;box-shadow:0 0 6px rgba(192,83,47,.8);}

/* ===== 主界面 ===== */
#main-view{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;}
.main-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:linear-gradient(180deg,#2f2312,#241a0d);
  border-bottom:2px solid var(--bg-3);
}
.main-header .brand{font-family:var(--pixel);font-size:14px;color:var(--gold-1);letter-spacing:3px;display:flex;align-items:center;gap:10px;}
.main-header .brand .logo-ico{width:26px;height:26px;}
.header-user{display:flex;align-items:center;gap:12px;font-size:14px;}
.header-user .uname{color:var(--gold-0);letter-spacing:1px;}
.header-user .online-dot{width:9px;height:9px;border-radius:50%;background:#7ba05b;box-shadow:0 0 6px rgba(123,160,91,.9);}
.main-body{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;
  padding:14px;overflow:hidden;
}
.main-left{display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;}
.main-right{display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;}

/* 游戏选择卡片 */
.games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.game-card{
  position:relative;padding:16px 12px 14px;text-align:center;cursor:pointer;
  border-radius:6px;transition:all .15s ease;
  background:linear-gradient(180deg,#2f2312,#241a0d);
  border:2px solid var(--bg-3);
}
.game-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.4);}
.game-card.sel{border-color:var(--gold-0);box-shadow:0 0 0 2px rgba(212,168,67,.25);}
.game-card .g-ico{width:46px;height:46px;margin:0 auto 10px;}
.game-card .g-name{font-family:var(--pixel);font-size:13px;color:var(--gold-1);letter-spacing:2px;}
.game-card .g-sub{font-size:12px;color:var(--text-dim);margin-top:6px;letter-spacing:1px;}
.game-card .g-online{position:absolute;top:8px;right:8px;font-size:11px;color:#7ba05b;}
.game-card .g-tag{position:absolute;top:8px;left:8px;font-size:11px;color:var(--gold-dim);}

/* 模式选择 */
.mode-row{display:flex;gap:10px;flex-wrap:wrap;}
.mode-row .btn{flex:1;min-width:120px;padding:14px 10px;font-size:15px;}
.mode-row .btn .m-ico{display:block;margin:0 auto 6px;width:26px;height:26px;}
.mode-row .btn .m-txt{display:block;letter-spacing:2px;}
.mode-row .btn .m-sub{display:block;font-size:11px;color:var(--text-dim);margin-top:4px;letter-spacing:0;}

/* 难度选择 */
.diff-row{display:flex;gap:8px;}
.diff-row .btn{flex:1;font-size:13px;padding:8px 6px;}

/* 好友面板 */
.friend-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bg-3);}
.friend-head .t{font-family:var(--pixel);font-size:11px;color:var(--gold-1);letter-spacing:2px;}
.friend-head .add-btn{font-size:12px;color:var(--gold-0);border:1px solid var(--bg-3);padding:4px 10px;border-radius:3px;}
.friend-list{padding:6px;max-height:220px;overflow-y:auto;}
.friend-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:4px;cursor:pointer;transition:background .1s;}
.friend-item:hover{background:#32260f;}
.friend-item .ava{
  width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--pixel);font-size:12px;color:#241a0d;background:linear-gradient(180deg,#c9a24a,#a07f33);flex:none;
}
.friend-item .f-name{flex:1;font-size:14px;letter-spacing:1px;}
.friend-item .f-state{font-size:11px;color:#7ba05b;}
.friend-item .f-op{display:flex;gap:4px;flex:none;}
.friend-item .f-op button{font-size:11px;padding:3px 8px;border:1px solid var(--bg-3);border-radius:3px;color:var(--gold-0);}
.friend-item .f-op button:hover{color:var(--gold-1);border-color:var(--gold-dim);}
.friend-empty{text-align:center;color:var(--text-dim);font-size:13px;padding:18px 8px;line-height:1.8;}
.friend-req{max-height:140px;overflow-y:auto;border-bottom:1px solid var(--bg-3);padding:4px 8px;}
.friend-req .req-item{display:flex;align-items:center;gap:6px;padding:6px 4px;font-size:13px;}
.friend-req .req-item .r-name{flex:1;color:var(--gold-0);}
.friend-req .req-item button{font-size:12px;padding:3px 10px;border-radius:3px;}

/* 聊天窗口（私聊） */
.chat-window{display:flex;flex-direction:column;min-height:0;flex:1;}
.chat-body{flex:1;overflow-y:auto;padding:8px 10px;min-height:120px;max-height:260px;}
.chat-msg{margin:4px 0;font-size:14px;line-height:1.5;display:flex;flex-direction:column;}
.chat-msg .cm-head{font-size:11px;color:var(--text-dim);display:flex;gap:6px;align-items:center;}
.chat-msg.mine{align-items:flex-end;}
.chat-msg.mine .cm-head{color:var(--gold-dim);}
.chat-msg .cm-content{
  background:#201708;border:1px solid var(--bg-3);border-radius:4px;
  padding:6px 10px;margin-top:2px;max-width:85%;word-break:break-word;color:var(--text);
}
.chat-msg.mine .cm-content{background:#2f2610;border-color:#4a3c1c;}
.chat-input-row{display:flex;gap:8px;padding:8px;border-top:1px solid var(--bg-3);}
.chat-input-row .input{font-size:14px;padding:8px 10px;}
.chat-input-row .btn{padding:8px 14px;flex:none;}
.chat-empty{text-align:center;color:var(--text-dim);font-size:13px;padding:20px 8px;line-height:1.8;}

/* ===== 对局界面 ===== */
#game-view{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;background:var(--bg-0);}
.game-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 14px;background:linear-gradient(180deg,#2f2312,#241a0d);
  border-bottom:2px solid var(--bg-3);flex-wrap:wrap;
}
.game-header .g-left{display:flex;align-items:center;gap:10px;}
.game-header .g-left .back-btn{font-size:13px;color:var(--gold-0);border:1px solid var(--bg-3);padding:6px 12px;border-radius:4px;}
.game-header .g-left .g-title{font-family:var(--pixel);font-size:13px;color:var(--gold-1);letter-spacing:2px;}
.game-header .g-info{font-size:13px;color:var(--text);display:flex;align-items:center;gap:12px;}
.game-header .g-info .turn-txt{color:var(--gold-0);}
.game-header .g-info .turn-txt.my-turn{color:#7ba05b;animation:turnPulse 1s infinite;}
@keyframes turnPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.game-body{flex:1;display:flex;gap:12px;padding:12px;overflow:hidden;min-height:0;}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;}
#board-canvas{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:4px;
  box-shadow:0 0 0 3px #120d06, 0 10px 40px rgba(0,0,0,.6);}
.game-side{width:280px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:none;}
.game-side .side-panel{display:flex;flex-direction:column;min-height:0;}
.side-players{padding:8px 12px;display:flex;flex-direction:column;gap:8px;}
.side-player{display:flex;align-items:center;gap:10px;}
.side-player .p-ava{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:13px;color:#241a0d;background:linear-gradient(180deg,#c9a24a,#a07f33);}
.side-player .p-info{flex:1;}
.side-player .p-name{font-size:14px;color:var(--text);}
.side-player .p-role{font-size:11px;color:var(--text-dim);}
.side-player.active .p-ava{box-shadow:0 0 0 2px var(--gold-0);}
.side-player.active .p-name{color:var(--gold-1);}
.side-player .p-tag{font-size:11px;color:var(--gold-dim);}
.side-ops{display:flex;gap:8px;padding:0 12px 12px;}
.side-ops .btn{flex:1;font-size:13px;padding:8px 6px;}
.game-chat{flex:1;display:flex;flex-direction:column;min-height:0;}
.game-chat .chat-body{flex:1;min-height:60px;max-height:none;}

/* 匹配弹窗 */
.match-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,7,3,.75);backdrop-filter:blur(2px);}
.match-box{width:min(340px,90vw);padding:30px 26px;text-align:center;}
.match-ico{width:56px;height:56px;margin:0 auto 16px;}
.match-ico .ring{animation:spin 1.2s linear infinite;transform-origin:center;}
@keyframes spin{to{transform:rotate(360deg);}}
.match-title{font-family:var(--pixel);font-size:14px;color:var(--gold-1);letter-spacing:2px;}
.match-sub{font-size:13px;color:var(--text-dim);margin-top:10px;line-height:1.8;}
.match-timer{font-family:var(--pixel);font-size:20px;color:var(--gold-0);margin-top:12px;}
.match-cancel{margin-top:20px;width:100%;}

/* 挑战弹窗 */
.chal-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,7,3,.75);backdrop-filter:blur(2px);}
.chal-box{width:min(380px,92vw);padding:26px 24px;text-align:center;}
.chal-box .chal-q{font-size:17px;line-height:1.9;margin:12px 0 4px;color:var(--text);}
.chal-box .chal-q b{color:var(--gold-1);}
.chal-box .chal-type{font-size:13px;color:var(--gold-dim);letter-spacing:2px;margin-bottom:18px;}
.chal-actions{display:flex;gap:10px;}
.chal-actions .btn{flex:1;}

/* 通用弹窗 */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,7,3,.7);}
.modal-box{width:min(360px,92vw);padding:24px;text-align:center;}
.modal-box .m-title{font-family:var(--pixel);font-size:13px;color:var(--gold-1);letter-spacing:2px;margin-bottom:14px;}
.modal-box .m-body{font-size:15px;line-height:1.9;color:var(--text);margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}

/* Toast */
#toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  background:#241a0d;border:2px solid var(--bg-3);border-radius:4px;
  color:var(--text);font-size:14px;padding:10px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .2s ease;
  max-width:90vw;text-align:center;
}
.toast.gold{color:var(--gold-1);border-color:var(--gold-dim);}
.toast.red{color:#f0c7a0;border-color:#8a4a2e;}
.toast.green{color:#a8d090;border-color:#4a6a38;}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

/* 响应式 */
@media (max-width:860px){
  .main-body{grid-template-columns:1fr;overflow-y:auto;}
  .main-right{order:-1;max-height:300px;}
  .games-grid{grid-template-columns:repeat(3,1fr);}
  .game-body{flex-direction:column;overflow-y:auto;}
  .game-side{width:100%;}
  .game-chat .chat-body{max-height:150px;}
  .board-wrap{min-height:340px;}
  .mode-row .btn{min-width:100%;}
}
@media (max-width:480px){
  .games-grid{gap:8px;}
  .game-card{padding:10px 6px;}
  .game-card .g-name{font-size:10px;letter-spacing:1px;}
  .game-card .g-sub{font-size:10px;}
  .logo-title{font-size:20px !important;letter-spacing:3px !important;}
  .main-header .brand{font-size:11px;}
}
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="login-view">
  <div class="login-box panel">
    <div class="logo-title">娱乐下棋</div>
    <div class="logo-sub">围棋 · 象棋 · 五子棋</div>
    <div class="login-field">
      <label>玩家姓名</label>
      <input class="input" id="login-name" maxlength="16" placeholder="2-16位中文/字母/数字" />
    </div>
    <div class="login-field">
      <label>密码</label>
      <input class="input" id="login-pass" type="password" maxlength="32" placeholder="4-32位" />
    </div>
    <div class="login-actions">
      <button class="btn btn-gold" id="btn-login">登 录</button>
      <button class="btn" id="btn-register">注 册</button>
    </div>
    <div class="login-hint">输入姓名密码即可登录，<b>新玩家自动注册</b><br/>与好友联机对战，对局内可实时聊天</div>
    <div class="server-line"><span class="dot" id="server-dot"></span><span id="server-txt">正在检测服务器…</span></div>
  </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="main-view" class="hidden">
  <div class="main-header">
    <div class="brand">
      <svg class="logo-ico" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="9" height="9" fill="#d4a843"/><rect x="13" y="2" width="9" height="9" fill="#8a6f3a"/><rect x="2" y="13" width="9" height="9" fill="#8a6f3a"/><rect x="13" y="13" width="9" height="9" fill="#f0c75e"/></svg>
      <span>娱乐下棋</span>
    </div>
    <div class="header-user">
      <span class="online-dot"></span>
      <span class="uname" id="header-uname"></span>
      <button class="btn btn-xs" onclick="window.open('https://goodisyoufather.github.io/portfolio/','_blank')">同人作品集</button>
      <button class="btn btn-xs" id="btn-logout">退出</button>
    </div>
  </div>
  <div class="main-body">
    <div class="main-left">
      <!-- 游戏选择 -->
      <div class="panel">
        <div class="panel-title">选择棋类</div>
        <div style="padding:12px;">
          <div class="games-grid" id="games-grid"></div>
        </div>
      </div>
      <!-- 模式选择 -->
      <div class="panel">
        <div class="panel-title">选择模式</div>
        <div style="padding:12px;display:flex;flex-direction:column;gap:10px;">
          <div class="mode-row">
            <button class="btn" id="mode-ai">
              <span class="m-ico"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="#d4a843" stroke-width="1.6"/><circle cx="9" cy="9" r="2.2" fill="#d4a843"/><circle cx="15" cy="15" r="2.2" fill="#f0c75e"/><path d="M4 20l5-5M20 4l-5 5" stroke="#8a6f3a" stroke-width="1.4"/></svg></span>
              <span class="m-txt">AI 对战</span>
              <span class="m-sub">人机切磋 · 自选难度</span>
            </button>
            <button class="btn" id="mode-match">
              <span class="m-ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="3.2" stroke="#d4a843" stroke-width="1.6"/><circle cx="16" cy="16" r="3.2" stroke="#f0c75e" stroke-width="1.6"/><path d="M10.5 10.5l3 3" stroke="#8a6f3a" stroke-width="1.4"/></svg></span>
              <span class="m-txt">联机匹配</span>
              <span class="m-sub">随机匹配 · 15秒</span>
            </button>
            <button class="btn" id="mode-friend">
              <span class="m-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20c0-3 3-4.5 8-4.5S20 17 20 20" stroke="#d4a843" stroke-width="1.6"/><circle cx="12" cy="8" r="3.4" stroke="#f0c75e" stroke-width="1.6"/></svg></span>
              <span class="m-txt">好友对战</span>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ================= 全局配置 ================= */
var API_BASE = window.location.origin; // 同源部署自动匹配（Railway/本地后端serve）
// 本地 file:// 直接打开 HTML 时，指向本地后端 8090
if (!API_BASE || API_BASE === 'null' || location.protocol === 'file:') {
  API_BASE = 'http://127.0.0.1:8090';
}
var TOKEN_KEY = 'yule_xiangqi_token';
var token = localStorage.getItem(TOKEN_KEY) || '';
var myName = '';
var myAccount = null;
var friendsList = [];
var reqList = [];
var currentChatWith = null;
var chatHistory = {};
var selGame = 'wuziqi';
var selDifficulty = 'medium';
var pollInboxTimer = null;
var pollGameTimer = null;
var pollChatTimer = null;

/* ================= 工具函数 ================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg, cls){
  var root = $('toast-root');
  var el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}
function fmtTime(ts){
  var d = new Date(ts);
  function p(n){ return n < 10 ? '0' + n : '' + n; }
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function showModal(html){
  var root = $('modal-root');
  root.innerHTML = html;
  return root.firstElementChild;
}
function closeModal(){
  $('modal-root').innerHTML = '';
}
function confirmer(title, body, okText, okCls, cb){
  showModal('<div class="modal"><div class="modal-box panel"><div class="m-title">' + esc(title) + '</div>' +
    '<div class="m-body">' + body + '</div>' +
    '<div class="modal-actions">' +
    '<button class="btn" id="m-cancel">取消</button>' +
    '<button class="btn ' + (okCls || 'btn-gold') + '" id="m-ok">' + esc(okText || '确定') + '</button>' +
    '</div></div></div>');
  $('m-cancel').onclick = closeModal;
  $('m-ok').onclick = function(){ closeModal(); cb && cb(); };
}

/* ================= API 封装 ================= */
function apiPost(url, data){
  return fetch(API_BASE + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token: token }, data || {}))
  }).then(function(r){ return r.json(); }).catch(function(e){
    return { ok: false, msg: '网络错误：无法连接服务器' };
  });
}
function apiGet(url){
  var sep = url.indexOf('?') >= 0 ? '&' : '?';
  return fetch(API_BASE + url + sep + 'token=' + encodeURIComponent(token))
    .then(function(r){ return r.json(); }).catch(function(e){
    return { ok: false, msg: '网络错误：无法连接服务器' };
  });
}

/* ================= 登录 ================= */
function checkServer(){
  fetch(API_BASE + '/api/test').then(function(r){ return r.json(); }).then(function(d){
    $('server-dot').className = 'dot on';
    $('server-txt').textContent = '服务器已连接';
  }).catch(function(){
    $('server-dot').className = 'dot off';
    $('server-txt').textContent = '服务器连接失败';
  });
}
$('btn-login').onclick = doLogin;
$('btn-register').onclick = doRegister;
$('login-name').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
$('login-pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

function doLogin(){
  var name = $('login-name').value.trim();
  var pass = $('login-pass').value;
  if (!name || !pass) return toast('请输入姓名和密码', 'red');
  $('btn-login').disabled = true;
  apiPost('/api/login', { name: name, password: pass }).then(function(r){
    $('btn-login').disabled = false;
    if (!r.ok) return toast(r.msg || '登录失败', 'red');
    token = r.token;
    localStorage.setItem(TOKEN_KEY, token);
    myName = r.user.name;
    enterMain();
  });
}
function doRegister(){
  var name = $('login-name').value.trim();
  var pass = $('login-pass').value;
  if (!name || !pass) return toast('请输入姓名和密码', 'red');
  $('btn-register').disabled = true;
  apiPost('/api/register', { name: name, password: pass }).then(function(r){
    $('btn-register').disabled = false;
    if (!r.ok) return toast(r.msg || '注册失败', 'red');
    token = r.token;
    localStorage.setItem(TOKEN_KEY, token);
    myName = r.user.name;
    toast('注册成功，欢迎 ' + myName, 'green');
    enterMain();
  });
}
$('btn-logout').onclick = function(){
  confirmer('退出登录', '确定要退出当前账号吗？', '退出', 'btn-red', function(){
    localStorage.removeItem(TOKEN_KEY);
    token = '';
    stopPolling();
    $('main-view').classList.add('hidden');
    $('login-view').classList.remove('hidden');
  });
};

function enterMain(){
  $('login-view').classList.add('hidden');
  $('main-view').classList.remove('hidden');
  $('header-uname').textContent = myName;
  renderGames();
  loadFriends();
  startPolling();
  toast('欢迎回来，' + myName, 'green');
}

/* ================= 游戏选择 ================= */
var GAME_META = {
  weiqi:  { name: '围棋',   sub: '19×19 · 围地争胜',  ico: '<svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" fill="#1c1409" stroke="#5a4428"/><path d="M1 7h22M1 12h22M1 17h22M7 1v22M12 1v22M17 1v22" stroke="#5a4428" stroke-width=".6"/><circle cx="5" cy="5" r="2" fill="#e8dcc0"/><circle cx="12" cy="12" r="2" fill="#241a0d" stroke="#5a4428" stroke-width=".6"/></svg>' },
  xiangqi: { name: '象棋',   sub: '9×10 · 楚河汉界',  ico: '<svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" fill="#241a0d" stroke="#5a4428"/><path d="M1 12h22" stroke="#d4a843" stroke-width="1"/><text x="12" y="15.5" font-size="9" fill="#d4a843" text-anchor="middle" font-family="serif">楚河汉界</text><circle cx="6" cy="5" r="1.4" fill="#e8dcc0"/><circle cx="18" cy="5" r="1.4" fill="#241a0d" stroke="#8a6f3a"/></svg>' },
  wuziqi: { name: '五子棋', sub: '15×15 · 五连为胜',  ico: '<svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" fill="#1c1409" stroke="#5a4428"/><path d="M1 6h22M1 12h22M1 18h22M6 1v22M12 1v22M18 1v22" stroke="#5a4428" stroke-width=".6"/><circle cx="6" cy="6" r="1.7" fill="#e8dcc0"/><circle cx="12" cy="12" r="1.7" fill="#241a0d" stroke="#5a4428"/><circle cx="18" cy="18" r="1.7" fill="#e8dcc0"/></svg>' }
};
function renderGames(){
  var html = '';
  Object.keys(GAME_META).forEach(function(k){
    var g = GAME_META[k];
    html += '<div class="game-card' + (selGame === k ? ' sel' : '') + '" data-g="' + k + '">' +
      '<span class="g-online">在线</span>' +
      '<span class="g-tag">' + (k === 'xiangqi' ? '经典' : (k === 'weiqi' ? '国粹' : '休闲')) + '</span>' +
      '<div class="g-ico">' + g.ico + '</div>' +
      '<div class="g-name">' + g.name + '</div>' +
      '<div class="g-sub">' + g.sub + '</div></div>';
  });
  $('games-grid').innerHTML = html;
  Array.prototype.forEach.call($('games-grid').querySelectorAll('.game-card'), function(el){
    el.onclick = function(){
      selGame = el.getAttribute('data-g');
      renderGames();
    };
  });
}

$('mode-ai').onclick = function(){
  $('diff-row').classList.remove('hidden');
  $('mode-tip').textContent = '已选择：' + GAME_META[selGame].name + ' · AI对战（' + diffName(selDifficulty) + '）';
};
$('mode-match').onclick = function(){
  $('diff-row').classList.add('hidden');
  $('mode-tip').textContent = '已选择：' + GAME_META[selGame].name + ' · 联机匹配（15秒无对手自动取消）';
  startMatch(selGame);
};
$('mode-friend').onclick = function(){
  $('diff-row').classList.add('hidden');
  if (!currentChatWith) return toast('请先在右侧选择一位好友', 'red');
  $('mode-tip').textContent = '已选择：' + GAME_META[selGame].name + ' · 向 ' + currentChatWith + ' 发起挑战书';
  sendChallenge(currentChatWith, selGame);
};
Array.prototype.forEach.call(document.querySelectorAll('.diff-btn'), function(b){
  b.onclick = function(){
    selDifficulty = b.getAttribute('data-d');
    Array.prototype.forEach.call(document.querySelectorAll('.diff-btn'), function(x){ x.style.borderColor = ''; });
    b.style.borderColor = '#f0c75e';
    startAiGame();
  };
});
function diffName(d){ return d === 'easy' ? '简单' : (d === 'hard' ? '困难' : '中等'); }

/* ================= 好友 ================= */
function loadFriends(){
  apiGet('/api/friends/list').then(function(r){
    if (!r.ok) return;
    friendsList = r.friends || [];
    reqList = r.requests || [];
    renderFriends();
    renderRequests();
  });
}
function renderFriends(){
  var el = $('friend-list');
  if (!friendsList.length) {
    el.innerHTML = '<div class="friend-empty">还没有好友<br/>点击右上角"加好友"添加</div>';
    return;
  }
  var html = '';
  friendsList.forEach(function(f){
    html += '<div class="friend-item" data-f="' + esc(f) + '">' +
      '<div class="ava">' + esc(f.charAt(0)) + '</div>' +
      '<div class="f-name">' + esc(f) + '</div>' +
      '<span class="f-state">在线</span>' +
      '<div class="f-op">' +
      '<button class="f-chat" title="私聊">聊</button>' +
      '<button class="f-chal" title="发起挑战书">战</button>' +
      '</div></div>';
  });
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll('.friend-item'), function(item){
    var f = item.getAttribute('data-f');
    item.querySelector('.f-chat').onclick = function(e){ e.stopPropagation(); openPrivateChat(f); };
    item.querySelector('.f-chal').onclick = function(e){ e.stopPropagation(); askChallenge(f); };
    item.onclick = function(){ openPrivateChat(f); };
  });
}
function renderRequests(){
  var el = $('req-list');
  if (!reqList.length) {
    el.innerHTML = '<div class="friend-empty">暂无好友请求</div>';
    return;
  }
  var html = '';
  reqList.forEach(function(n){
    html += '<div class="req-item"><span class="r-name">' + esc(n) + '</span>' +
      '<button class="btn btn-xs btn-gold" data-a="1" data-n="' + esc(n) + '">接受</button>' +
      '<button class="btn btn-xs" data-a="0" data-n="' + esc(n) + '">拒绝</button></div>';
  });
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(b){
    b.onclick = function(){
      var accept = b.getAttribute('data-a') === '1';
      var n = b.getAttribute('data-n');
      apiPost('/api/friends/respond', { friendName: n, accept: accept }).then(function(r){
        toast(r.msg || (accept ? '已接受' : '已拒绝'), r.ok ? 'green' : 'red');
        loadFriends();
      });
    };
  });
}
$('btn-add-friend').onclick = function(){
  showModal('<div class="modal"><div class="modal-box panel"><div class="m-title">添加好友</div>' +
    '<div style="margin-bottom:14px;"><input class="input" id="add-friend-name" maxlength="16" placeholder="输入对方姓名" /></div>' +
    '<div class="modal-actions">' +
    '<button class="btn" id="af-cancel">取消</button>' +
    '<button class="btn btn-gold" id="af-ok">发送请求</button></div></div></div>');
  $('af-cancel').onclick = closeModal;
  $('af-ok').onclick = function(){
    var n = $('add-friend-name').value.trim();
    if (!n) return;
    apiPost('/api/friends/add', { friendName: n }).then(function(r){
      toast(r.msg || '已发送', r.ok ? 'green' : 'red');
      closeModal();
      loadFriends();
    });
  };
};

/* ================= 找好友 ================= */
function loadDiscoverFriends(){
  apiGet('/api/friends/discover').then(function(r){
    var el = $('discover-list');
    if (!r.ok || !r.users || !r.users.length) {
      el.innerHTML = '<div class="friend-empty">暂无可推荐的玩家<br/>多邀请朋友来玩吧~</div>';
      return;
    }
    var html = '';
    r.users.forEach(function(u){
      html += '<div class="friend-item" style="cursor:default;">' +
        '<div class="ava" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#d4a843,#8a6f3a);display:flex;align-items:center;justify-content:center;font-size:14px;color:#1a1208;font-weight:bold;">' + esc(u.name.charAt(0)) + '</div>' +
        '<span class="f-name">' + esc(u.name) + '</span>' +
        '<span class="f-state" style="color:' + (u.online ? '#7ba05b' : '#888') + ';">' + (u.online ? '在线' : '离线') + '</span>' +
        '<div class="f-op"><button class="btn btn-xs btn-gold" data-add="' + esc(u.name) + '">＋ 加好友</button></div>' +
        '</div>';
    });
    el.innerHTML = html;
    // 绑定加好友按钮
    Array.prototype.forEach.call(el.querySelectorAll('[data-add]'), function(btn){
      btn.onclick = function(){
        var n = btn.getAttribute('data-add');
        btn.disabled = true;
        btn.textContent = '已发送';
        apiPost('/api/friends/add', { friendName: n }).then(function(r){
          toast(r.msg || '好友请求已发送', r.ok ? 'green' : 'red');
          loadFriends();
        });
      };
    });
  });
}
$('btn-discover-friend').onclick = function(){
  showModal('<div class="modal"><div class="modal-box panel" style="width:420px;max-height:80vh;display:flex;flex-direction:column;">' +
    '<div class="m-title">🔍 找好友</div>' +
    '<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;text-align:center;">随机推荐玩家，点击"加好友"发送请求</div>' +
    '<div id="discover-list" style="flex:1;overflow-y:auto;padding:4px;"><div class="friend-empty">加载中...</div></div>' +
    '<div class="modal-actions">' +
    '<button class="btn" id="df-close">关闭</button>' +
    '<button class="btn btn-gold" id="df-refresh">🔄 换一批</button></div></div></div>');
  $('df-close').onclick = closeModal;
  $('df-refresh').onclick = loadDiscoverFriends;
  loadDiscoverFriends();
};

/* ================= 私聊 ================= */
function openPrivateChat(friend){
  currentChatWith = friend;
  $('chat-title').textContent = '私聊 · ' + friend;
  $('private-chat-body').innerHTML = '<div class="chat-empty">加载中…</div>';
  apiGet('/api/chat/history?with=' + encodeURIComponent(friend)).then(function(r){
    if (!r.ok) return;
    chatHistory[friend] = r.messages || [];
    renderPrivateChat();
  });
}
function renderPrivateChat(){
  if (!currentChatWith) return;
  var msgs = chatHistory[currentChatWith] || [];
  var el = $('private-chat-body');
  if (!msgs.length) {
    el.innerHTML = '<div class="chat-empty">还没有聊天记录<br/>打个招呼吧</div>';
    return;
  }
  var html = '';
  msgs.forEach(function(m){
    var mine = m.from === myName;
    html += '<div class="chat-msg' + (mine ? ' mine' : '') + '">' +
      '<div class="cm-head"><span>' + esc(mine ? '我' : m.from) + '</span><span>' + fmtTime(m.time) + '</span></div>' +
      '<div class="cm-content">' + esc(m.content) + '</div></div>';
  });
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}
$('btn-private-send').onclick = sendPrivate;
$('private-chat-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendPrivate(); });
function sendPrivate(){
  if (!currentChatWith) return toast('请先选择一位好友', 'red');
  var content = $('private-chat-input').value.trim();
  if (!content) return;
  $('private-chat-input').value = '';
  apiPost('/api/chat/send', { to: currentChatWith, content: content }).then(function(r){
    if (!r.ok) return toast(r.msg || '发送失败', 'red');
    if (!chatHistory[currentChatWith]) chatHistory[currentChatWith] = [];
    chatHistory[currentChatWith].push({ from: myName, to: currentChatWith, content: content, time: Date.now() });
    renderPrivateChat();
  });
}

/* ================= 挑战书 ================= */
function askChallenge(friend){
  showModal('<div class="modal"><div class="modal-box panel"><div class="m-title">发起挑战书</div>' +
    '<div class="m-body">向 <b style="color:#f0c75e">' + esc(friend) + '</b> 发起一场<br/><b>' + GAME_META[selGame].name + '</b> 对局？</div>' +
    '<div class="modal-actions">' +
    '<button class="btn" id="ch-cancel">取消</button>' +
    '<button class="btn btn-gold" id="ch-ok">发出挑战</button></div></div></div>');
  $('ch-cancel').onclick = closeModal;
  $('ch-ok').onclick = function(){
    closeModal();
    sendChallenge(friend, selGame);
  };
}
function sendChallenge(friend, gameType){
  apiPost('/api/challenge/create', { to: friend, gameType: gameType }).then(function(r){
    toast(r.msg || (r.ok ? '挑战书已发出，等待对方接受' : ''), r.ok ? 'green' : 'red');
  });
}

/* ================= 匹配 ================= */
var matchTimer = null;
var matchStartTs = 0;
function startMatch(gameType){
  showModal('<div class="match-modal" id="match-modal">' +
    '<div class="match-box panel">' +
    '<div class="match-ico"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#d4a843" stroke-width="2.4" fill="none" stroke-dasharray="40 17"/><circle cx="12" cy="12" r="4" fill="#f0c75e"/></svg></div>' +
    '<div class="match-title">正在匹配</div>' +
    '<div class="match-sub">' + GAME_META[gameType].name + ' · 寻找对手中…<br/>15秒内无对手将自动取消</div>' +
    '<div class="match-timer" id="match-timer">15s</div>' +
    '<button class="btn btn-red match-cancel" id="match-cancel">取消匹配</button>' +
    '</div></div>');
  matchStartTs = Date.now();
  updateMatchTimer();
  matchTimer = setInterval(updateMatchTimer, 500);
  $('match-cancel').onclick = function(){
    apiPost('/api/match/cancel', {}).then(function(){});
    closeMatchModal();
    toast('已取消匹配', '');
  };
  apiPost('/api/match/join', { gameType: gameType }).then(function(r){
    if (!r.ok) {
      closeMatchModal();
      toast(r.msg || '匹配失败', 'red');
      return;
    }
    if (r.matched) {
      closeMatchModal();
      enterRoom(r.room);
    }
  });
}
function updateMatchTimer(){
  var remain = Math.max(0, Math.round((15000 - (Date.now() - matchStartTs)) / 1000));
  var el = $('match-timer');
  if (el) el.textContent = remain + 's';
  if (remain <= 0) {
    clearInterval(matchTimer);
    // 服务器会推送超时事件，这里兜底关闭
    if ($('match-modal')) {
      closeMatchModal();
      toast('15秒未匹配到对手，已取消', '');
    }
  }
}
function closeMatchModal(){
  clearInterval(matchTimer);
  closeModal();
}
